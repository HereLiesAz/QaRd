pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://raw.githubusercontent.com/HereLiesAz/AzNavRail/update-maven/"
            content {
                includeModule("com.github.HereLiesAz.AzNavRail", "aznavrail-updates-compat")
                includeModule("com.github.HereLiesAz.AzNavRail", "aznavrail-updates-play-compat")
            }
        }
        maven { url "https://jitpack.io" }

    }
}
rootProject.name = "qard"
include ':app'
include ':feature_transfer'
